# SmartSeed Fabric dev network (3 orgs, 3 Raft orderers, 1 peer per org, Fabric CA per org).
# UNVERIFIED: not executed on the authoring machine (Docker was not running). Use network.sh.
# CouchDB is optional: `network.sh up --couchdb` activates the `couchdb` profile and sets STATE_DB=CouchDB.
name: smartseed-fabric

networks:
  smartseed_net:
    name: smartseed_net

x-ca: &ca-base
  image: hyperledger/fabric-ca:${CA_IMAGE_TAG:-1.5}
  networks: [smartseed_net]
  environment: &ca-env
    FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
    FABRIC_CA_SERVER_TLS_ENABLED: "true"
    FABRIC_CA_SERVER_CSR_HOSTS: localhost
    CA_ADMIN_USER: ${CA_ADMIN_USER:?run network.sh up (generates .env)}
    CA_ADMIN_PASS: ${CA_ADMIN_PASS:?run network.sh up (generates .env)}
  command: sh -c 'fabric-ca-server start -b "$$CA_ADMIN_USER:$$CA_ADMIN_PASS" -d'

x-orderer: &orderer-base
  image: hyperledger/fabric-orderer:${FABRIC_IMAGE_TAG:-2.5}
  networks: [smartseed_net]
  working_dir: /root
  command: orderer
  environment: &orderer-env
    FABRIC_LOGGING_SPEC: INFO
    ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
    ORDERER_GENERAL_LISTENPORT: "7050"
    ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    ORDERER_GENERAL_BOOTSTRAPMETHOD: none
    ORDERER_GENERAL_TLS_ENABLED: "true"
    ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_TLS_ROOTCAS: /var/hyperledger/tls-ca-bundle.pem
    ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_CLUSTER_ROOTCAS: /var/hyperledger/tls-ca-bundle.pem
    ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
    ORDERER_ADMIN_TLS_ENABLED: "true"
    ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_ADMIN_TLS_ROOTCAS: /var/hyperledger/tls-ca-bundle.pem
    ORDERER_ADMIN_TLS_CLIENTROOTCAS: /var/hyperledger/tls-ca-bundle.pem
    ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053

x-peer: &peer-base
  image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-2.5}
  networks: [smartseed_net]
  working_dir: /root
  command: peer node start
  environment: &peer-env
    FABRIC_LOGGING_SPEC: INFO
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /var/hyperledger/tls-ca-bundle.pem
    CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production
    CORE_PEER_GOSSIP_USELEADERELECTION: "true"
    CORE_PEER_GOSSIP_ORGLEADER: "false"
    CORE_PEER_PROFILE_ENABLED: "false"
    # Chaincode launched through the peer's Docker builder (needs the host docker socket).
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: smartseed_net
    CORE_LEDGER_STATE_STATEDATABASE: ${STATE_DB:-goleveldb}
    CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-}
    CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-}

x-couch: &couch-base
  image: couchdb:${COUCHDB_IMAGE_TAG:-3.3}
  networks: [smartseed_net]
  profiles: [couchdb]
  environment: &couch-env
    COUCHDB_USER: ${COUCHDB_USER:-}
    COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-}

services:
  ca.smartseed.example.com:
    <<: *ca-base
    container_name: ca.smartseed.example.com
    environment: { <<: *ca-env, FABRIC_CA_SERVER_CA_NAME: ca-smartseed, FABRIC_CA_SERVER_PORT: "7054" }
    ports: ["7054:7054"]
    volumes: ["./organizations/smartseed/ca:/etc/hyperledger/fabric-ca-server"]

  ca.authority.example.com:
    <<: *ca-base
    container_name: ca.authority.example.com
    environment: { <<: *ca-env, FABRIC_CA_SERVER_CA_NAME: ca-authority, FABRIC_CA_SERVER_PORT: "8054" }
    ports: ["8054:8054"]
    volumes: ["./organizations/authority/ca:/etc/hyperledger/fabric-ca-server"]

  ca.manufacturer.example.com:
    <<: *ca-base
    container_name: ca.manufacturer.example.com
    environment: { <<: *ca-env, FABRIC_CA_SERVER_CA_NAME: ca-manufacturer, FABRIC_CA_SERVER_PORT: "9054" }
    ports: ["9054:9054"]
    volumes: ["./organizations/manufacturer/ca:/etc/hyperledger/fabric-ca-server"]

  orderer1.smartseed.example.com:
    <<: *orderer-base
    container_name: orderer1.smartseed.example.com
    environment: { <<: *orderer-env, ORDERER_GENERAL_LOCALMSPID: SmartSeedMSP }
    ports: ["7050:7050", "7053:7053"]
    volumes:
      - ./organizations/smartseed/orderers/orderer1/msp:/var/hyperledger/orderer/msp
      - ./organizations/smartseed/orderers/orderer1/tls:/var/hyperledger/orderer/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - orderer1.smartseed.example.com:/var/hyperledger/production/orderer

  orderer2.authority.example.com:
    <<: *orderer-base
    container_name: orderer2.authority.example.com
    environment: { <<: *orderer-env, ORDERER_GENERAL_LOCALMSPID: AuthorityMSP }
    ports: ["8050:7050", "8053:7053"]
    volumes:
      - ./organizations/authority/orderers/orderer2/msp:/var/hyperledger/orderer/msp
      - ./organizations/authority/orderers/orderer2/tls:/var/hyperledger/orderer/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - orderer2.authority.example.com:/var/hyperledger/production/orderer

  orderer3.smartseed.example.com:
    <<: *orderer-base
    container_name: orderer3.smartseed.example.com
    environment: { <<: *orderer-env, ORDERER_GENERAL_LOCALMSPID: SmartSeedMSP }
    ports: ["9050:7050", "9053:7053"]
    volumes:
      - ./organizations/smartseed/orderers/orderer3/msp:/var/hyperledger/orderer/msp
      - ./organizations/smartseed/orderers/orderer3/tls:/var/hyperledger/orderer/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - orderer3.smartseed.example.com:/var/hyperledger/production/orderer

  peer0.smartseed.example.com:
    <<: *peer-base
    container_name: peer0.smartseed.example.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.smartseed.example.com
      CORE_PEER_LOCALMSPID: SmartSeedMSP
      CORE_PEER_ADDRESS: peer0.smartseed.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.smartseed.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.authority.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.smartseed.example.com:7051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.smartseed.example.com:5984
    ports: ["7051:7051"]
    volumes:
      - ./organizations/smartseed/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ./organizations/smartseed/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.smartseed.example.com:/var/hyperledger/production

  peer0.authority.example.com:
    <<: *peer-base
    container_name: peer0.authority.example.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.authority.example.com
      CORE_PEER_LOCALMSPID: AuthorityMSP
      CORE_PEER_ADDRESS: peer0.authority.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.authority.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.smartseed.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.authority.example.com:9051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.authority.example.com:5984
    ports: ["9051:9051"]
    volumes:
      - ./organizations/authority/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ./organizations/authority/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.authority.example.com:/var/hyperledger/production

  peer0.manufacturer.example.com:
    <<: *peer-base
    container_name: peer0.manufacturer.example.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.manufacturer.example.com
      CORE_PEER_LOCALMSPID: ManufacturerMSP
      CORE_PEER_ADDRESS: peer0.manufacturer.example.com:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.manufacturer.example.com:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.smartseed.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.manufacturer.example.com:11051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.manufacturer.example.com:5984
    ports: ["11051:11051"]
    volumes:
      - ./organizations/manufacturer/peers/peer0/msp:/etc/hyperledger/fabric/msp
      - ./organizations/manufacturer/peers/peer0/tls:/etc/hyperledger/fabric/tls
      - ./organizations/tls-ca-bundle.pem:/var/hyperledger/tls-ca-bundle.pem
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.manufacturer.example.com:/var/hyperledger/production

  couchdb.smartseed.example.com:
    <<: *couch-base
    container_name: couchdb.smartseed.example.com
    volumes: ["couchdb.smartseed.example.com:/opt/couchdb/data"]

  couchdb.authority.example.com:
    <<: *couch-base
    container_name: couchdb.authority.example.com
    volumes: ["couchdb.authority.example.com:/opt/couchdb/data"]

  couchdb.manufacturer.example.com:
    <<: *couch-base
    container_name: couchdb.manufacturer.example.com
    volumes: ["couchdb.manufacturer.example.com:/opt/couchdb/data"]

volumes:
  orderer1.smartseed.example.com:
  orderer2.authority.example.com:
  orderer3.smartseed.example.com:
  peer0.smartseed.example.com:
  peer0.authority.example.com:
  peer0.manufacturer.example.com:
  couchdb.smartseed.example.com:
  couchdb.authority.example.com:
  couchdb.manufacturer.example.com:
