name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: API, web and shared (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Tests boot an embedded Postgres automatically; no service container is required.
      - run: npm run typecheck
      - run: npm test -w @smartseed/api -- --coverage
      - run: npm test -w @smartseed/web
      - run: npm run build

  chaincode:
    name: Chaincode unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chaincode/smartseed-cc } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: chaincode/smartseed-cc/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  ai:
    name: AI detection service
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-optional.txt -r requirements-dev.txt
      - run: mypy app
      - run: pytest --cov=app -q

  mobile:
    name: Farmer app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --coverage

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit && pip-audit -r services/ai/requirements.txt

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [node, chaincode, ai]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t smartseed-api:ci .
      - run: docker build -f apps/api/Dockerfile --target migrate -t smartseed-migrate:ci .
      - run: docker build -f apps/web/Dockerfile -t smartseed-web:ci .
      - run: docker build -t smartseed-ai:ci services/ai
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: smartseed-api:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
